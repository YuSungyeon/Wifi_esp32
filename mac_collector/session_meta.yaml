# MeshSense 실험 세션 메타 (실험 전 작성 → CLI 수집 시작 시 스냅샷 복사)
# run 구분 SSOT: session_id 로 raw/.../session_<id>/ 경로·JSONL 라벨 결정

# 실험 회차 ID — 다음 수집을 시작하기 전에 변경
session_id: 30

# 실험일(의미 라벨). raw/YYYYMMDD 폴더명(수집기 실행일)과는 별개 — 수동으로 맞춤.
date: "2026-06-16"

# 실험 공간(방) 정보 — 후처리·논문·재현용 기록
room:
  width_m: 3.0      # 방 가로 (m)
  height_m: 3.0     # 방 세로 (m)
  description: "3m x 3m indoor room"  # 배치·가구·특이사항 요약

# ML·라벨링·데이터 분할 관련 실험 설계 기록
experiment:
  objective: "3-class activity classification"  # 실험 목표(태스크)
  label_target: "motion"                    # 라벨 형식/대상
  split_strategy: "train"        # train/val/test 분할 방식

# 현재 공식 수집 방식: ESP-NOW CSI → USB-Serial-JTAG → Mac JSONL
acquisition:
  radio_transport: "esp_now_broadcast"
  host_transport: "usb_serial_jtag"
  channel: 11
  bandwidth: "HT20"
  csi_ltf: "LLTF"
  target_hz: 100
  csi_representation: "raw_iq_amplitude"
  on_device_preprocessing: false

# 참여 RX 장치 — 실험 기록용이며 현재 CLI 수집 filter로 사용하지 않음
# 실제 수집 대상은 USB에 연결되고 device_registry.csv 와 일치하는 RX
devices:
  registry_file: "mac_collector/device_registry.csv"  # 장치 등록표 경로
  expected_device_ids: [101, 102, 103]  # 이번 세션에 켤 RX device_id 목록

# 운영자·현장 메모 (피험자 수, 동작 프로토콜, 환경 변화 등)
operator:
  name: "no person"
  notes: "에어컨 on, 전등 on, 창문 닫힘, 피험자(yang)가 걸어다니며 움직임(휴대폰 사용, 느린 움직임)"
