# MeshSense 실험 세션 메타
# 편집은 `python scripts/session_form.py` (브라우저 폼)를 권장합니다.
# 수집 시 세션 디렉터리에 session_meta_snapshot.yaml 로 복사됩니다.
#
# session_id 는 여기에 두지 않습니다 — 수집한 세션들의 최댓값+1로 자동 부여됩니다.

# 수집 시작 프롬프트의 기본 라벨 (empty / static / action)
label_target: "empty"

# 실험일 (수집 폴더 날짜와 별개로 기록)
date: "2026-08-26"

# 실험 공간
room:
  width_m: 3.0
  height_m: 3.0
  description: "실험 공간 설명 (배치·가구·특이사항)"

# 실험 설계
experiment:
  objective: "3-class activity classification"
  split_strategy: "session-wise"

# 이번 실험에 켤 RX device_id (device_registry.csv 와 대응)
devices:
  expected_device_ids: [101, 103]

# 운영자·현장 메모
operator:
  name: ""
  notes: "피험자 수, 동작 프로토콜, 환경 변화 등을 기록"
